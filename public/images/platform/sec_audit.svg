<svg width="800" height="520" viewBox="0 0 800 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="dotGrid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.2" fill="#334155" fill-opacity="0.28" />
    </pattern>
    <linearGradient id="emeraldGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05DF72" />
      <stop offset="100%" stop-color="#00A854" />
    </linearGradient>
  </defs>

  <!-- Dark Canvas -->
  <rect width="800" height="520" rx="12" fill="#070A10" />
  <rect width="800" height="520" rx="12" fill="url(#dotGrid)" />

  
    <g transform="translate(100, 60)">
      <rect width="600" height="400" rx="14" fill="#090E17" stroke="#10B981" stroke-width="1.2" />
      <g transform="translate(60, 50)">
        <!-- Timeline Line -->
        <line x1="20" y1="20" x2="20" y2="280" stroke="#222F44" stroke-width="2"/>
        
          <g transform="translate(0, 0)">
            <circle cx="20" cy="27" r="8" fill="#1E293B" stroke="#05DF72" stroke-width="2" />
            <rect x="50" y="0" width="280" height="54" rx="8" fill="#121824" stroke="#253246" />
            <text x="70" y="32" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Changed attribute to "Priority"</text>
          </g>
        
          <g transform="translate(0, 75)">
            <circle cx="20" cy="27" r="8" fill="#1E293B" stroke="#05DF72" stroke-width="2" />
            <rect x="50" y="0" width="280" height="54" rx="8" fill="#121824" stroke="#253246" />
            <text x="70" y="32" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Left a comment on Line 04</text>
          </g>
        
          <g transform="translate(0, 150)">
            <circle cx="20" cy="27" r="8" fill="#1E293B" stroke="#05DF72" stroke-width="2" />
            <rect x="50" y="0" width="280" height="54" rx="8" fill="#121824" stroke="#253246" />
            <text x="70" y="32" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Changed attribute to "In Progress"</text>
          </g>
        
          <g transform="translate(0, 225)">
            <circle cx="20" cy="27" r="8" fill="#1E293B" stroke="#05DF72" stroke-width="2" />
            <rect x="50" y="0" width="280" height="54" rx="8" fill="#121824" stroke="#253246" />
            <text x="70" y="32" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Rotated client mTLS certificates</text>
          </g>
        
      </g>
      <!-- Big Magnifying Glass on Right -->
      <g transform="translate(420, 160)">
        <circle cx="45" cy="45" r="45" fill="#0E281E" stroke="#05DF72" stroke-width="2" />
        <circle cx="40" cy="40" r="18" fill="none" stroke="#A7F3D0" stroke-width="2.5" />
        <line x1="54" y1="54" x2="68" y2="68" stroke="#A7F3D0" stroke-width="3.5" stroke-linecap="round"/>
      </g>
    </g>
  
</svg>