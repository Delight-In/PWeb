<svg width="1024" height="672" viewBox="0 0 1024 672" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dot Grid Pattern -->
    <pattern id="dotGrid" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="1.5" fill="#334155" fill-opacity="0.25" />
    </pattern>

    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#4E7A66" />
    </marker>
  </defs>

  <!-- Deep Industrial Canvas -->
  <rect width="1024" height="672" rx="16" fill="#080B11" />
  <rect width="1024" height="672" rx="16" fill="url(#dotGrid)" />

  <!-- CONNECTORS: Center Hub to 6 External Cards -->
  <!-- Top-Left -->
  <line x1="462" y1="288" x2="236" y2="202" stroke="#4E7A66" stroke-width="1.8" marker-end="url(#arrow)" />
  <!-- Top-Center -->
  <line x1="512" y1="266" x2="512" y2="202" stroke="#4E7A66" stroke-width="1.8" marker-end="url(#arrow)" />
  <!-- Top-Right -->
  <line x1="562" y1="288" x2="788" y2="202" stroke="#4E7A66" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- Bottom-Left -->
  <line x1="462" y1="384" x2="236" y2="470" stroke="#4E7A66" stroke-width="1.8" marker-end="url(#arrow)" />
  <!-- Bottom-Center -->
  <line x1="512" y1="406" x2="512" y2="470" stroke="#4E7A66" stroke-width="1.8" marker-end="url(#arrow)" />
  <!-- Bottom-Right -->
  <line x1="562" y1="384" x2="788" y2="470" stroke="#4E7A66" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- CENTER: PrishiTech Central Management Hub -->
  <g transform="translate(512, 336)">
    <circle cx="0" cy="0" r="70" fill="#060A10" stroke="#3D5A4C" stroke-width="1.8" />
    <polygon points="0,-36 31,-18 31,18 0,36 -31,18 -31,-18" fill="#0C121D" stroke="#FFFFFF" stroke-width="1.8" stroke-linejoin="round" />
    <path d="M -9 -17 L 3 -17 C 9 -17 12 -14 12 -9 C 12 -4 9 -1 3 -1 L -9 -1 Z" fill="#05DF72" fill-opacity="0.2" stroke="#05DF72" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M -9 -17 L -9 15" stroke="#05DF72" stroke-width="3.2" stroke-linecap="round" />
    <circle cx="4" cy="14" r="2.5" fill="#38BDF8" />
  </g>

  <!-- TOP-LEFT: Documents / File Records -->
  <g transform="translate(162, 68)">
    <rect width="126" height="126" rx="14" fill="#141922" stroke="#232B3A" stroke-width="1.5" />
    <g transform="translate(36, 28)">
      <!-- Back page -->
      <path d="M 12 6 H 48 V 64 H 12 Z" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round" />
      <!-- Front page -->
      <path d="M 4 16 H 40 V 74 H 4 Z" fill="#141922" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round" />
      <line x1="12" y1="28" x2="32" y2="28" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
      <line x1="12" y1="40" x2="32" y2="40" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
      <line x1="12" y1="52" x2="28" y2="52" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
      <line x1="12" y1="64" x2="24" y2="64" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
    </g>
  </g>

  <!-- TOP-CENTER: Analytics Trend / KPI Chart -->
  <g transform="translate(450, 68)">
    <rect width="126" height="126" rx="14" fill="#141922" stroke="#232B3A" stroke-width="1.5" />
    <g transform="translate(32, 38)">
      <!-- Axis lines and zig-zag trend line with area -->
      <path d="M 0 46 L 20 22 L 36 34 L 62 8 L 62 46 Z" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round" />
    </g>
  </g>

  <!-- TOP-RIGHT: Database / Operational Storage -->
  <g transform="translate(738, 68)">
    <rect width="126" height="126" rx="14" fill="#141922" stroke="#232B3A" stroke-width="1.5" />
    <g transform="translate(38, 32)">
      <!-- 3-tier cylindrical database -->
      <!-- Top disc -->
      <ellipse cx="25" cy="12" rx="25" ry="9" fill="none" stroke="#FFFFFF" stroke-width="2.5" />
      <!-- Middle segment -->
      <path d="M 0 12 V 32 C 0 37 11 41 25 41 C 39 41 50 37 50 32 V 12" fill="none" stroke="#FFFFFF" stroke-width="2.5" />
      <!-- Bottom segment -->
      <path d="M 0 32 V 52 C 0 57 11 61 25 61 C 39 61 50 57 50 52 V 32" fill="none" stroke="#FFFFFF" stroke-width="2.5" />
    </g>
  </g>

  <!-- BOTTOM-LEFT: Industrial Plant 1 -->
  <g transform="translate(162, 478)">
    <rect width="126" height="126" rx="14" fill="#141922" stroke="#232B3A" stroke-width="1.5" />
    <g transform="translate(33, 40)">
      <!-- Factory silhouette -->
      <path d="M 4 48 V 16 L 22 28 V 16 L 40 28 V 4 L 58 4 V 48 Z" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round" />
      <!-- 3 windows -->
      <rect x="12" y="34" width="7" height="7" rx="1" fill="#FFFFFF" />
      <rect x="26" y="34" width="7" height="7" rx="1" fill="#FFFFFF" />
      <rect x="40" y="34" width="7" height="7" rx="1" fill="#FFFFFF" />
    </g>
  </g>

  <!-- BOTTOM-CENTER: Industrial Plant 2 -->
  <g transform="translate(450, 478)">
    <rect width="126" height="126" rx="14" fill="#141922" stroke="#232B3A" stroke-width="1.5" />
    <g transform="translate(33, 40)">
      <path d="M 4 48 V 16 L 22 28 V 16 L 40 28 V 4 L 58 4 V 48 Z" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round" />
      <rect x="12" y="34" width="7" height="7" rx="1" fill="#FFFFFF" />
      <rect x="26" y="34" width="7" height="7" rx="1" fill="#FFFFFF" />
      <rect x="40" y="34" width="7" height="7" rx="1" fill="#FFFFFF" />
    </g>
  </g>

  <!-- BOTTOM-RIGHT: Industrial Plant 3 -->
  <g transform="translate(738, 478)">
    <rect width="126" height="126" rx="14" fill="#141922" stroke="#232B3A" stroke-width="1.5" />
    <g transform="translate(33, 40)">
      <path d="M 4 48 V 16 L 22 28 V 16 L 40 28 V 4 L 58 4 V 48 Z" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round" />
      <rect x="12" y="34" width="7" height="7" rx="1" fill="#FFFFFF" />
      <rect x="26" y="34" width="7" height="7" rx="1" fill="#FFFFFF" />
      <rect x="40" y="34" width="7" height="7" rx="1" fill="#FFFFFF" />
    </g>
  </g>
</svg>