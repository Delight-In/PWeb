<svg width="1024" height="672" viewBox="0 0 1024 672" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dot Grid Pattern -->
    <pattern id="dotGrid" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="1.5" fill="#334155" fill-opacity="0.25" />
    </pattern>

    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#4E7A66" />
    </marker>
  </defs>

  <!-- Deep Industrial Canvas -->
  <rect width="1024" height="672" rx="16" fill="#080B11" />
  <rect width="1024" height="672" rx="16" fill="url(#dotGrid)" />

  <!-- CONNECTOR 1: Left Robot Card to Center Hub -->
  <line x1="304" y1="336" x2="416" y2="336" stroke="#4E7A66" stroke-width="2" marker-end="url(#arrow)" />

  <!-- CONNECTOR 2, 3, 4: Center Hub to 3 Right Dashed Circles -->
  <!-- To Top-Right Instance -->
  <line x1="588" y1="288" x2="718" y2="196" stroke="#4E7A66" stroke-width="2" marker-end="url(#arrow)" />
  <!-- To Center-Right Instance -->
  <line x1="600" y1="336" x2="718" y2="336" stroke="#4E7A66" stroke-width="2" marker-end="url(#arrow)" />
  <!-- To Bottom-Right Instance -->
  <line x1="588" y1="384" x2="718" y2="476" stroke="#4E7A66" stroke-width="2" marker-end="url(#arrow)" />

  <!-- LEFT: Master Asset Template Card (Robotic Arm) -->
  <g transform="translate(176, 272)">
    <rect width="128" height="128" rx="14" fill="#141922" stroke="#232B3A" stroke-width="1.5" />
    <!-- Solid White Industrial Robotic Arm Icon -->
    <g transform="translate(22, 22)">
      <!-- Robot Base -->
      <path d="M 12 76 H 72 V 68 C 72 64 68 60 64 60 H 20 C 16 60 12 64 12 68 Z" fill="#FFFFFF" />
      <!-- Base Joint / Pivot Turntable -->
      <circle cx="42" cy="52" r="10" fill="#FFFFFF" />
      <!-- Lower Arm Segment -->
      <path d="M 37 52 L 20 28 L 28 22 L 46 46 Z" fill="#FFFFFF" />
      <!-- Elbow Joint -->
      <circle cx="24" cy="25" r="7" fill="#FFFFFF" />
      <!-- Forearm Segment -->
      <path d="M 24 25 L 56 12 L 60 18 L 28 31 Z" fill="#FFFFFF" />
      <!-- Wrist Joint -->
      <circle cx="58" cy="15" r="5" fill="#FFFFFF" />
      <!-- Gripper End-Effector Claws -->
      <path d="M 58 15 L 72 10 L 76 18 M 58 15 L 72 26 L 76 20" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" />
    </g>
  </g>

  <!-- CENTER: PrishiTech Modeling Hub -->
  <g transform="translate(512, 336)">
    <circle cx="0" cy="0" r="85" fill="#060A10" stroke="#3D5A4C" stroke-width="1.8" />
    <!-- PrishiTech Emblem -->
    <polygon points="0,-44 38,-22 38,22 0,44 -38,22 -38,-22" fill="#0C121D" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round" />
    <path d="M -11 -20 L 4 -20 C 12 -20 16 -16 16 -10 C 16 -4 12 0 4 0 L -11 0 Z" fill="#05DF72" fill-opacity="0.2" stroke="#05DF72" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M -11 -20 L -11 18" stroke="#05DF72" stroke-width="3.8" stroke-linecap="round" />
    <circle cx="5" cy="16" r="3" fill="#38BDF8" />
  </g>

  <!-- RIGHT TOP: Replicated Asset Model 1 (Dashed Circle) -->
  <g transform="translate(776, 160)">
    <circle cx="0" cy="0" r="56" fill="#060A10" stroke="#4E7A66" stroke-width="2" stroke-dasharray="6 6" />
    <!-- Mint-tinted Robotic Arm Icon -->
    <g transform="translate(-25, -28) scale(0.6)">
      <path d="M 12 76 H 72 V 68 C 72 64 68 60 64 60 H 20 C 16 60 12 64 12 68 Z" fill="#6EE7B7" />
      <circle cx="42" cy="52" r="10" fill="#6EE7B7" />
      <path d="M 37 52 L 20 28 L 28 22 L 46 46 Z" fill="#6EE7B7" />
      <circle cx="24" cy="25" r="7" fill="#6EE7B7" />
      <path d="M 24 25 L 56 12 L 60 18 L 28 31 Z" fill="#6EE7B7" />
      <circle cx="58" cy="15" r="5" fill="#6EE7B7" />
      <path d="M 58 15 L 72 10 L 76 18 M 58 15 L 72 26 L 76 20" stroke="#6EE7B7" stroke-width="3" stroke-linecap="round" fill="none" />
    </g>
  </g>

  <!-- RIGHT CENTER: Replicated Asset Model 2 (Dashed Circle) -->
  <g transform="translate(776, 336)">
    <circle cx="0" cy="0" r="56" fill="#060A10" stroke="#4E7A66" stroke-width="2" stroke-dasharray="6 6" />
    <g transform="translate(-25, -28) scale(0.6)">
      <path d="M 12 76 H 72 V 68 C 72 64 68 60 64 60 H 20 C 16 60 12 64 12 68 Z" fill="#6EE7B7" />
      <circle cx="42" cy="52" r="10" fill="#6EE7B7" />
      <path d="M 37 52 L 20 28 L 28 22 L 46 46 Z" fill="#6EE7B7" />
      <circle cx="24" cy="25" r="7" fill="#6EE7B7" />
      <path d="M 24 25 L 56 12 L 60 18 L 28 31 Z" fill="#6EE7B7" />
      <circle cx="58" cy="15" r="5" fill="#6EE7B7" />
      <path d="M 58 15 L 72 10 L 76 18 M 58 15 L 72 26 L 76 20" stroke="#6EE7B7" stroke-width="3" stroke-linecap="round" fill="none" />
    </g>
  </g>

  <!-- RIGHT BOTTOM: Replicated Asset Model 3 (Dashed Circle) -->
  <g transform="translate(776, 512)">
    <circle cx="0" cy="0" r="56" fill="#060A10" stroke="#4E7A66" stroke-width="2" stroke-dasharray="6 6" />
    <g transform="translate(-25, -28) scale(0.6)">
      <path d="M 12 76 H 72 V 68 C 72 64 68 60 64 60 H 20 C 16 60 12 64 12 68 Z" fill="#6EE7B7" />
      <circle cx="42" cy="52" r="10" fill="#6EE7B7" />
      <path d="M 37 52 L 20 28 L 28 22 L 46 46 Z" fill="#6EE7B7" />
      <circle cx="24" cy="25" r="7" fill="#6EE7B7" />
      <path d="M 24 25 L 56 12 L 60 18 L 28 31 Z" fill="#6EE7B7" />
      <circle cx="58" cy="15" r="5" fill="#6EE7B7" />
      <path d="M 58 15 L 72 10 L 76 18 M 58 15 L 72 26 L 76 20" stroke="#6EE7B7" stroke-width="3" stroke-linecap="round" fill="none" />
    </g>
  </g>
</svg>