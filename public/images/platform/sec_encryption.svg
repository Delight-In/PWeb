<svg width="1024" height="672" viewBox="0 0 1024 672" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dot Grid Pattern -->
    <pattern id="dotGrid" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="1.5" fill="#334155" fill-opacity="0.25" />
    </pattern>

    <!-- Double-ended Arrow Markers -->
    <marker id="arrowStart" viewBox="0 0 10 10" refX="4" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 8 1 L 0 5 L 8 9 z" fill="#4E7A66" />
    </marker>
    <marker id="arrowEnd" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#4E7A66" />
    </marker>
  </defs>

  <!-- Deep Industrial Canvas -->
  <rect width="1024" height="672" rx="16" fill="#080B11" />
  <rect width="1024" height="672" rx="16" fill="url(#dotGrid)" />

  <!-- LEFT: PrishiTech Edge Platform Card -->
  <g transform="translate(136, 256)">
    <rect width="160" height="160" rx="16" fill="#141922" stroke="#232B3A" stroke-width="1.5" />
    <!-- Center PrishiTech Emblem -->
    <g transform="translate(80, 80)">
      <polygon points="0,-46 40,-23 40,23 0,46 -40,23 -40,-23" fill="#0C121D" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round" />
      <path d="M -11 -21 L 4 -21 C 12 -21 16 -17 16 -11 C 16 -5 12 -1 4 -1 L -11 -1 Z" fill="#05DF72" fill-opacity="0.2" stroke="#05DF72" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M -11 -21 L -11 19" stroke="#05DF72" stroke-width="4" stroke-linecap="round" />
      <circle cx="5" cy="17" r="3" fill="#38BDF8" />
    </g>
  </g>

  <!-- CONNECTOR: Left to Center (Double-Ended Arrow) -->
  <line x1="304" y1="336" x2="424" y2="336" stroke="#4E7A66" stroke-width="2" marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)" />

  <!-- CENTER: Secure SSL/TLS Encryption & Certification Padlock -->
  <g transform="translate(512, 336)">
    <circle cx="0" cy="0" r="82" fill="#5F8B77" />
    <!-- Solid White Padlock -->
    <!-- Shackle -->
    <path d="M -17 -10 V -24 C -17 -34 17 -34 17 -24 V -10" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" />
    <!-- Padlock Body -->
    <rect x="-28" y="-10" width="56" height="46" rx="7" fill="#FFFFFF" />
    <!-- Keyhole cutout -->
    <circle cx="0" cy="10" r="4.5" fill="#5F8B77" />
    <path d="M -2 10 L 2 10 L 3 22 L -3 22 Z" fill="#5F8B77" />
  </g>

  <!-- CONNECTOR: Center to Right (Double-Ended Arrow) -->
  <line x1="600" y1="336" x2="720" y2="336" stroke="#4E7A66" stroke-width="2" marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)" />

  <!-- RIGHT: Enterprise Application Dashboard / Analytics Card -->
  <g transform="translate(728, 256)">
    <rect width="160" height="160" rx="16" fill="#141922" stroke="#232B3A" stroke-width="1.5" />
    <!-- Application Window Frame -->
    <g transform="translate(36, 46)">
      <!-- Outer Browser Window -->
      <rect x="0" y="0" width="88" height="68" rx="8" fill="none" stroke="#FFFFFF" stroke-width="4.5" />
      <!-- Top Titlebar Divider -->
      <line x1="0" y1="18" x2="88" y2="18" stroke="#FFFFFF" stroke-width="3" />
      <!-- 4 Bar Chart Columns -->
      <line x1="16" y1="58" x2="16" y2="44" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
      <line x1="34" y1="58" x2="34" y2="34" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
      <line x1="52" y1="58" x2="52" y2="26" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
      <line x1="70" y1="58" x2="70" y2="38" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
    </g>
  </g>
</svg>