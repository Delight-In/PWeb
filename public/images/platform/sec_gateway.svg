<svg width="1024" height="672" viewBox="0 0 1024 672" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dot Grid Pattern -->
    <pattern id="dotGrid" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="1.5" fill="#334155" fill-opacity="0.25" />
    </pattern>

    <!-- Marker Arrow -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#4E7A66" />
    </marker>
  </defs>

  <!-- Deep Industrial Canvas -->
  <rect width="1024" height="672" rx="16" fill="#080B11" />
  <rect width="1024" height="672" rx="16" fill="url(#dotGrid)" />

  <!-- LEFT: External Network / Globe -->
  <g transform="translate(256, 336)">
    <circle cx="0" cy="0" r="76" fill="#0A0F17" stroke="#3D5A4C" stroke-width="1.8" />
    <!-- White Line Globe Icon -->
    <circle cx="0" cy="0" r="34" stroke="#FFFFFF" stroke-width="2.5" fill="none" />
    <ellipse cx="0" cy="0" rx="17" ry="34" stroke="#FFFFFF" stroke-width="2" fill="none" />
    <line x1="-34" y1="0" x2="34" y2="0" stroke="#FFFFFF" stroke-width="2" />
    <line x1="-28" y1="-16" x2="28" y2="-16" stroke="#FFFFFF" stroke-width="1.8" />
    <line x1="-28" y1="16" x2="28" y2="16" stroke="#FFFFFF" stroke-width="1.8" />
  </g>

  <!-- CONNECTORS: Globe to Center Hub -->
  <path d="M 332 336 L 418 316" stroke="#4E7A66" stroke-width="1.8" />
  <path d="M 332 336 L 418 356" stroke="#4E7A66" stroke-width="1.8" />

  <!-- CENTER: PrishiTech Platform Gateway Hub -->
  <g transform="translate(528, 336)">
    <circle cx="0" cy="0" r="110" fill="#060A10" stroke="#3D5A4C" stroke-width="1.8" />
    <!-- Rounded Outer Hexagon -->
    <polygon points="0,-48 42,-24 42,24 0,48 -42,24 -42,-24" fill="#0C121D" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round" />
    <!-- PrishiTech Stylized P Monogram in Vibrant Emerald -->
    <path d="M -12 -22 L 4 -22 C 12 -22 16 -18 16 -12 C 16 -6 12 -2 4 -2 L -12 -2 Z" fill="#05DF72" fill-opacity="0.18" stroke="#05DF72" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M -12 -22 L -12 20" stroke="#05DF72" stroke-width="4.2" stroke-linecap="round" />
    <circle cx="5" cy="18" r="3.2" fill="#38BDF8" />
  </g>

  <!-- CONNECTORS: Center Hub to Right Terminals -->
  <path d="M 610 268 L 720 245" stroke="#4E7A66" stroke-width="1.8" />
  <path d="M 610 404 L 720 427" stroke="#4E7A66" stroke-width="1.8" />

  <!-- RIGHT TOP: Terminal Monitor 1 -->
  <g transform="translate(720, 180)">
    <rect width="130" height="130" rx="14" fill="#141922" stroke="#232B3A" stroke-width="1.5" />
    <!-- Monitor Icon -->
    <rect x="33" y="32" width="64" height="46" rx="5" fill="none" stroke="#FFFFFF" stroke-width="2.5" />
    <line x1="56" y1="78" x2="74" y2="78" stroke="#FFFFFF" stroke-width="2.5" />
    <line x1="48" y1="88" x2="82" y2="88" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="65" cy="83" r="1.5" fill="#FFFFFF" />
  </g>

  <!-- RIGHT BOTTOM: Terminal Monitor 2 -->
  <g transform="translate(720, 362)">
    <rect width="130" height="130" rx="14" fill="#141922" stroke="#232B3A" stroke-width="1.5" />
    <!-- Monitor Icon -->
    <rect x="33" y="32" width="64" height="46" rx="5" fill="none" stroke="#FFFFFF" stroke-width="2.5" />
    <line x1="56" y1="78" x2="74" y2="78" stroke="#FFFFFF" stroke-width="2.5" />
    <line x1="48" y1="88" x2="82" y2="88" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="65" cy="83" r="1.5" fill="#FFFFFF" />
  </g>
</svg>