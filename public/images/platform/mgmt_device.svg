<svg width="1024" height="672" viewBox="0 0 1024 672" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dot Grid Pattern -->
    <pattern id="dotGrid" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="1.5" fill="#334155" fill-opacity="0.25" />
    </pattern>
  </defs>

  <!-- Deep Industrial Canvas -->
  <rect width="1024" height="672" rx="16" fill="#080B11" />
  <rect width="1024" height="672" rx="16" fill="url(#dotGrid)" />

  <!-- TREE CONNECTING NETWORK LINES -->
  <!-- Vertical trunk from top card -->
  <line x1="512" y1="230" x2="512" y2="336" stroke="#3D5A4C" stroke-width="2" />
  <!-- Horizontal distribution branch -->
  <line x1="208" y1="336" x2="816" y2="336" stroke="#3D5A4C" stroke-width="2" />
  <!-- 3 Vertical drops to bottom cards -->
  <line x1="208" y1="336" x2="208" y2="442" stroke="#3D5A4C" stroke-width="2" />
  <line x1="512" y1="336" x2="512" y2="442" stroke="#3D5A4C" stroke-width="2" />
  <line x1="816" y1="336" x2="816" y2="442" stroke="#3D5A4C" stroke-width="2" />

  <!-- TOP CARD: PrishiTech Edge Manager -->
  <g transform="translate(312, 130)">
    <rect width="400" height="100" rx="14" fill="#0B1017" stroke="#3D5A4C" stroke-width="2" />
    <!-- PrishiTech Emblem -->
    <g transform="translate(46, 50)">
      <polygon points="0,-27 24,-14 24,14 0,27 -24,14 -24,-14" fill="#0C121D" stroke="#FFFFFF" stroke-width="1.8" stroke-linejoin="round" />
      <path d="M -7 -13 L 2 -13 C 6 -13 9 -10 9 -6 C 9 -2 6 1 2 1 L -7 1 Z" fill="#05DF72" fill-opacity="0.2" stroke="#05DF72" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M -7 -13 L -7 12" stroke="#05DF72" stroke-width="2.6" stroke-linecap="round" />
      <circle cx="3" cy="11" r="2" fill="#38BDF8" />
    </g>
    <!-- Text: PrishiTech Edge Manager -->
    <text x="88" y="58" fill="#FFFFFF" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="600" letter-spacing="-0.3">PrishiTech Edge Manager</text>
  </g>

  <!-- BOTTOM CARD 1: PrishiTech Edge (Left) -->
  <g transform="translate(78, 442)">
    <rect width="260" height="96" rx="14" fill="#0B1017" stroke="#232E27" stroke-width="1.8" />
    <!-- PrishiTech Emblem -->
    <g transform="translate(40, 48)">
      <polygon points="0,-25 22,-12 22,12 0,25 -22,12 -22,-12" fill="#0C121D" stroke="#FFFFFF" stroke-width="1.8" stroke-linejoin="round" />
      <path d="M -6 -12 L 2 -12 C 5 -12 8 -9 8 -6 C 8 -3 5 0 2 0 L -6 0 Z" fill="#05DF72" fill-opacity="0.2" stroke="#05DF72" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M -6 -12 L -6 11" stroke="#05DF72" stroke-width="2.5" stroke-linecap="round" />
      <circle cx="3" cy="10" r="1.8" fill="#38BDF8" />
    </g>
    <!-- Text: PrishiTech Edge -->
    <text x="76" y="55" fill="#FFFFFF" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" letter-spacing="-0.3">PrishiTech Edge</text>
  </g>

  <!-- BOTTOM CARD 2: PrishiTech Edge (Center) -->
  <g transform="translate(382, 442)">
    <rect width="260" height="96" rx="14" fill="#0B1017" stroke="#232E27" stroke-width="1.8" />
    <g transform="translate(40, 48)">
      <polygon points="0,-25 22,-12 22,12 0,25 -22,12 -22,-12" fill="#0C121D" stroke="#FFFFFF" stroke-width="1.8" stroke-linejoin="round" />
      <path d="M -6 -12 L 2 -12 C 5 -12 8 -9 8 -6 C 8 -3 5 0 2 0 L -6 0 Z" fill="#05DF72" fill-opacity="0.2" stroke="#05DF72" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M -6 -12 L -6 11" stroke="#05DF72" stroke-width="2.5" stroke-linecap="round" />
      <circle cx="3" cy="10" r="1.8" fill="#38BDF8" />
    </g>
    <text x="76" y="55" fill="#FFFFFF" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" letter-spacing="-0.3">PrishiTech Edge</text>
  </g>

  <!-- BOTTOM CARD 3: PrishiTech Edge (Right) -->
  <g transform="translate(686, 442)">
    <rect width="260" height="96" rx="14" fill="#0B1017" stroke="#232E27" stroke-width="1.8" />
    <g transform="translate(40, 48)">
      <polygon points="0,-25 22,-12 22,12 0,25 -22,12 -22,-12" fill="#0C121D" stroke="#FFFFFF" stroke-width="1.8" stroke-linejoin="round" />
      <path d="M -6 -12 L 2 -12 C 5 -12 8 -9 8 -6 C 8 -3 5 0 2 0 L -6 0 Z" fill="#05DF72" fill-opacity="0.2" stroke="#05DF72" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M -6 -12 L -6 11" stroke="#05DF72" stroke-width="2.5" stroke-linecap="round" />
      <circle cx="3" cy="10" r="1.8" fill="#38BDF8" />
    </g>
    <text x="76" y="55" fill="#FFFFFF" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" letter-spacing="-0.3">PrishiTech Edge</text>
  </g>
</svg>