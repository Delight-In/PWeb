<svg width="800" height="520" viewBox="0 0 800 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="dotGrid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.2" fill="#334155" fill-opacity="0.28" />
    </pattern>
    <linearGradient id="emeraldGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05DF72" />
      <stop offset="100%" stop-color="#00A854" />
    </linearGradient>
  </defs>

  <!-- Dark Canvas -->
  <rect width="800" height="520" rx="12" fill="#070A10" />
  <rect width="800" height="520" rx="12" fill="url(#dotGrid)" />

  
    <g transform="translate(150, 80)">
      <rect width="500" height="360" rx="14" fill="#090E17" stroke="#10B981" stroke-width="1.2" />
      <g transform="translate(40, 40)">
        <text x="0" y="20" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="20" font-weight="800">Standard Glossary Definition</text>
        <text x="0" y="60" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="14" font-weight="600">OEE (Overall Equipment Effectiveness)</text>
        <text x="0" y="84" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">Standard manufacturing KPI used to measure how effective a machine,</text>
        <text x="0" y="104" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">line, or plant is utilized.</text>

        <g transform="translate(0, 140)">
          <rect width="420" height="100" rx="8" fill="#121824" stroke="#05DF72" stroke-width="1.5" />
          <text x="24" y="36" fill="#A7F3D0" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Formal Mathematical Definition:</text>
          <text x="24" y="68" fill="#FFFFFF" font-family="monospace" font-size="15" font-weight="700">OEE = Availability × Performance × Quality</text>
        </g>
      </g>
    </g>
  
</svg>