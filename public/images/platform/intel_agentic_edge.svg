<svg width="800" height="520" viewBox="0 0 800 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="dotGrid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.2" fill="#334155" fill-opacity="0.28" />
    </pattern>
    <linearGradient id="emeraldGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05DF72" />
      <stop offset="100%" stop-color="#00A854" />
    </linearGradient>
  </defs>

  <!-- Dark Canvas -->
  <rect width="800" height="520" rx="12" fill="#070A10" />
  <rect width="800" height="520" rx="12" fill="url(#dotGrid)" />

  
    <g transform="translate(100, 60)">
      <rect width="600" height="400" rx="14" fill="#090E17" stroke="#10B981" stroke-width="1.2" />

      <!-- Center Supervisor -->
      <g transform="translate(230, 160)">
        <rect width="140" height="60" rx="8" fill="#0D3323" stroke="#05DF72" stroke-width="2" />
        <text x="70" y="36" fill="#A7F3D0" font-family="system-ui, sans-serif" font-size="15" font-weight="800" text-anchor="middle">Supervisor</text>
      </g>

      <!-- Start (Top) and End (Bottom) -->
      <g transform="translate(250, 70)">
        <rect width="100" height="44" rx="6" fill="#121824" stroke="#253246" />
        <text x="50" y="27" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Start</text>
      </g>
      <line x1="300" y1="114" x2="300" y2="160" stroke="#05DF72" stroke-width="1.8" />

      <g transform="translate(250, 270)">
        <rect width="100" height="44" rx="6" fill="#121824" stroke="#253246" />
        <text x="50" y="27" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">End</text>
      </g>
      <line x1="300" y1="220" x2="300" y2="270" stroke="#05DF72" stroke-width="1.8" />

      <!-- Left Agents -->
      <g transform="translate(40, 110)">
        <rect width="140" height="50" rx="6" fill="#121824" stroke="#38BDF8" />
        <text x="70" y="30" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Deployment Agent</text>
      </g>
      <path d="M 180 135 C 210 135, 210 190, 230 190" fill="none" stroke="#05DF72" stroke-width="1.8"/>

      <g transform="translate(40, 220)">
        <rect width="140" height="50" rx="6" fill="#121824" stroke="#38BDF8" />
        <text x="70" y="30" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Config Agent</text>
      </g>
      <path d="M 180 245 C 210 245, 210 190, 230 190" fill="none" stroke="#05DF72" stroke-width="1.8"/>

      <!-- Right Agents -->
      <g transform="translate(420, 110)">
        <rect width="140" height="50" rx="6" fill="#121824" stroke="#A855F7" />
        <text x="70" y="30" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Namespace Agent</text>
      </g>
      <path d="M 420 135 C 390 135, 390 190, 370 190" fill="none" stroke="#05DF72" stroke-width="1.8"/>

      <g transform="translate(420, 220)">
        <rect width="140" height="50" rx="6" fill="#121824" stroke="#A855F7" />
        <text x="70" y="30" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Kubernetes Agent</text>
      </g>
      <path d="M 420 245 C 390 245, 390 190, 370 190" fill="none" stroke="#05DF72" stroke-width="1.8"/>
    </g>
  
</svg>