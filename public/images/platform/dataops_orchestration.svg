<svg width="800" height="520" viewBox="0 0 800 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="dotGrid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.2" fill="#334155" fill-opacity="0.28" />
    </pattern>
    <linearGradient id="emeraldGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05DF72" />
      <stop offset="100%" stop-color="#00A854" />
    </linearGradient>
  </defs>

  <!-- Dark Canvas -->
  <rect width="800" height="520" rx="12" fill="#070A10" />
  <rect width="800" height="520" rx="12" fill="url(#dotGrid)" />

  
    <g transform="translate(80, 70)">
      <!-- Left Sources -->
      <g transform="translate(20, 20)">
        
          <g transform="translate(0, 0)">
            <rect width="90" height="60" rx="8" fill="#121824" stroke="#253246" />
            <text x="45" y="36" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">SCADA</text>
          </g>
        
          <g transform="translate(0, 75)">
            <rect width="90" height="60" rx="8" fill="#121824" stroke="#253246" />
            <text x="45" y="36" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">PLC</text>
          </g>
        
          <g transform="translate(0, 150)">
            <rect width="90" height="60" rx="8" fill="#121824" stroke="#253246" />
            <text x="45" y="36" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Historian</text>
          </g>
        
          <g transform="translate(0, 225)">
            <rect width="90" height="60" rx="8" fill="#121824" stroke="#253246" />
            <text x="45" y="36" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Sensors</text>
          </g>
        
      </g>

      <!-- Connecting Arcs to Center -->
      <path d="M 110 50 C 180 50, 180 160, 220 160" fill="none" stroke="#05DF72" stroke-width="1.8"/>
      <path d="M 110 125 C 180 125, 180 160, 220 160" fill="none" stroke="#05DF72" stroke-width="1.8"/>
      <path d="M 110 200 C 180 200, 180 160, 220 160" fill="none" stroke="#05DF72" stroke-width="1.8"/>
      <path d="M 110 275 C 180 275, 180 160, 220 160" fill="none" stroke="#05DF72" stroke-width="1.8"/>

      <!-- Center PrishiTech Edge Box -->
      <g transform="translate(220, 105)">
        <rect width="250" height="110" rx="12" fill="#0B1320" stroke="#05DF72" stroke-width="2" />
        <g transform="translate(24, 34) scale(1)">
    <polygon points="20,2 38,12 38,32 20,42 2,32 2,12" fill="#0C1322" stroke="#05DF72" stroke-width="2" />
    <path d="M14 14 L24 14 C27 14 28.5 16 28.5 18.5 C28.5 21 27 23 24 23 L14 23 Z" fill="none" stroke="#05DF72" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M14 14 L14 30" stroke="#05DF72" stroke-width="2.5" stroke-linecap="round"/>
  </g>
        <text x="80" y="58" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="20" font-weight="800">PrishiTech</text>
        <text x="80" y="80" fill="#05DF72" font-family="system-ui, sans-serif" font-size="16" font-weight="600">Edge Pipeline</text>
      </g>

      <!-- Right Output Arrow -->
      <line x1="470" y1="160" x2="530" y2="160" stroke="#05DF72" stroke-width="2" />
      <polygon points="526,155 536,160 526,165" fill="#05DF72" />

      <!-- Right Dashboard Output -->
      <g transform="translate(536, 110)">
        <rect width="100" height="100" rx="10" fill="#121824" stroke="#253246" />
        <rect x="20" y="24" width="60" height="50" rx="4" fill="none" stroke="#38BDF8" stroke-width="2"/>
        <line x1="32" y1="55" x2="32" y2="65" stroke="#38BDF8" stroke-width="3"/>
        <line x1="42" y1="45" x2="42" y2="65" stroke="#38BDF8" stroke-width="3"/>
        <line x1="52" y1="38" x2="52" y2="65" stroke="#38BDF8" stroke-width="3"/>
        <line x1="62" y1="48" x2="62" y2="65" stroke="#38BDF8" stroke-width="3"/>
      </g>
    </g>
  
</svg>