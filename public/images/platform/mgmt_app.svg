<svg width="800" height="520" viewBox="0 0 800 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="dotGrid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.2" fill="#334155" fill-opacity="0.28" />
    </pattern>
    <linearGradient id="emeraldGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05DF72" />
      <stop offset="100%" stop-color="#00A854" />
    </linearGradient>
  </defs>

  <!-- Dark Canvas -->
  <rect width="800" height="520" rx="12" fill="#070A10" />
  <rect width="800" height="520" rx="12" fill="url(#dotGrid)" />

  
    <g transform="translate(100, 60)">
      <rect width="600" height="400" rx="14" fill="#090E17" stroke="#10B981" stroke-width="1.2" />

      <!-- Left Central App Repository -->
      <g transform="translate(60, 130)">
        <rect width="140" height="140" rx="12" fill="#141E2E" stroke="#05DF72" stroke-width="2"/>
        <rect x="35" y="40" width="70" height="60" rx="6" fill="none" stroke="#05DF72" stroke-width="2"/>
        <line x1="60" y1="40" x2="60" y2="100" stroke="#05DF72" stroke-width="2"/>
        <line x1="80" y1="40" x2="80" y2="100" stroke="#05DF72" stroke-width="2"/>
        <text x="70" y="122" fill="#A7F3D0" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">APP PACKAGE</text>
      </g>

      <!-- Distribution Arrows -->
      <path d="M 200 170 L 440 100" stroke="#05DF72" stroke-width="2"/>
      <polygon points="432,98 442,100 436,108" fill="#05DF72"/>

      <path d="M 200 200 L 380 200" stroke="#05DF72" stroke-width="2"/>
      <polygon points="372,196 382,200 372,204" fill="#05DF72"/>

      <path d="M 200 230 L 290 300" stroke="#05DF72" stroke-width="2"/>
      <polygon points="282,298 292,300 288,290" fill="#05DF72"/>

      <!-- 3 Plants Receiving -->
      <g transform="translate(440, 70)">
        <rect width="80" height="64" rx="8" fill="#121824" stroke="#253246"/>
        <text x="40" y="38" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Plant 01</text>
      </g>
      <g transform="translate(380, 168)">
        <rect width="80" height="64" rx="8" fill="#121824" stroke="#253246"/>
        <text x="40" y="38" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Plant 02</text>
      </g>
      <g transform="translate(290, 270)">
        <rect width="80" height="64" rx="8" fill="#121824" stroke="#253246"/>
        <text x="40" y="38" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Plant 03</text>
      </g>
    </g>
  
</svg>