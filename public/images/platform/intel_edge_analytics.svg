<svg width="800" height="520" viewBox="0 0 800 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="dotGrid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.2" fill="#334155" fill-opacity="0.28" />
    </pattern>
    <linearGradient id="emeraldGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05DF72" />
      <stop offset="100%" stop-color="#00A854" />
    </linearGradient>
  </defs>

  <!-- Dark Canvas -->
  <rect width="800" height="520" rx="12" fill="#070A10" />
  <rect width="800" height="520" rx="12" fill="url(#dotGrid)" />

  
    <g transform="translate(100, 60)">
      <rect width="600" height="400" rx="14" fill="#090E17" stroke="#10B981" stroke-width="1.2" />
      <g transform="translate(60, 60)">
        <!-- Axes -->
        <line x1="0" y1="0" x2="0" y2="280" stroke="#64748B" stroke-width="2"/>
        <line x1="0" y1="280" x2="480" y2="280" stroke="#64748B" stroke-width="2"/>
        <!-- Threshold Line -->
        <line x1="0" y1="140" x2="480" y2="140" stroke="#05DF72" stroke-width="2" stroke-dasharray="6 4"/>
        <text x="410" y="132" fill="#05DF72" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Threshold Limit</text>
        
        <!-- Sine Wave -->
        <path d="M 0 240 Q 60 40, 120 160 T 240 60 T 360 200 T 480 140" fill="none" stroke="#38BDF8" stroke-width="3"/>
        
        <!-- Anomaly Warning Pills -->
        <g transform="translate(95, 30)">
          <rect width="50" height="30" rx="6" fill="#7F1D1D" stroke="#EF4444" />
          <text x="25" y="20" fill="#FCA5A5" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">ALERT</text>
        </g>
        <g transform="translate(215, 35)">
          <rect width="50" height="30" rx="6" fill="#7F1D1D" stroke="#EF4444" />
          <text x="25" y="20" fill="#FCA5A5" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">ALERT</text>
        </g>
      </g>
    </g>
  
</svg>