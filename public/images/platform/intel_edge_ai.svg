<svg width="800" height="520" viewBox="0 0 800 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="dotGrid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.2" fill="#334155" fill-opacity="0.28" />
    </pattern>
    <linearGradient id="emeraldGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05DF72" />
      <stop offset="100%" stop-color="#00A854" />
    </linearGradient>
  </defs>

  <!-- Dark Canvas -->
  <rect width="800" height="520" rx="12" fill="#070A10" />
  <rect width="800" height="520" rx="12" fill="url(#dotGrid)" />

  
    <g transform="translate(100, 60)">
      <rect width="600" height="400" rx="14" fill="#090E17" stroke="#10B981" stroke-width="1.2" />

      <!-- Top AI Sparkle -->
      <g transform="translate(260, 40)">
        <rect width="80" height="80" rx="12" fill="#121824" stroke="#A855F7" stroke-width="2"/>
        <path d="M40 16 L44 34 L62 40 L44 46 L40 64 L36 46 L18 40 L36 34 Z" fill="none" stroke="#C084FC" stroke-width="2.5" stroke-linejoin="round"/>
      </g>

      <!-- Bidirectional Arrow -->
      <line x1="300" y1="120" x2="300" y2="190" stroke="#05DF72" stroke-width="2" />
      <polygon points="296,130 300,122 304,130" fill="#05DF72" />
      <polygon points="296,180 300,188 304,180" fill="#05DF72" />

      <!-- Center PrishiTech Edge Box -->
      <g transform="translate(170, 190)">
        <rect width="260" height="80" rx="12" fill="#0B1320" stroke="#05DF72" stroke-width="2" />
        <g transform="translate(20, 20) scale(0.9)">
    <polygon points="20,2 38,12 38,32 20,42 2,32 2,12" fill="#0C1322" stroke="#05DF72" stroke-width="2" />
    <path d="M14 14 L24 14 C27 14 28.5 16 28.5 18.5 C28.5 21 27 23 24 23 L14 23 Z" fill="none" stroke="#05DF72" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M14 14 L14 30" stroke="#05DF72" stroke-width="2.5" stroke-linecap="round"/>
  </g>
        <text x="70" y="44" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="18" font-weight="800">PrishiTech Edge</text>
        <text x="70" y="62" fill="#05DF72" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Local AI Inference Engine</text>
      </g>

      <!-- Bottom Sensor Inputs -->
      <g transform="translate(130, 310)">
        
          <g transform="translate(0, 0)">
            <rect width="70" height="46" rx="6" fill="#121824" stroke="#253246" />
            <text x="35" y="28" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">SCADA</text>
          </g>
        
          <g transform="translate(90, 0)">
            <rect width="70" height="46" rx="6" fill="#121824" stroke="#253246" />
            <text x="35" y="28" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">PLC</text>
          </g>
        
          <g transform="translate(180, 0)">
            <rect width="70" height="46" rx="6" fill="#121824" stroke="#253246" />
            <text x="35" y="28" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Historian</text>
          </g>
        
          <g transform="translate(270, 0)">
            <rect width="70" height="46" rx="6" fill="#121824" stroke="#253246" />
            <text x="35" y="28" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Sensors</text>
