<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="ptGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Hexagon/Rounded Box -->
  <rect width="100" height="100" rx="22" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />
  
  <!-- Outer Energy Ring segments -->
  <path d="M 50 16 A 34 34 0 0 1 84 50" stroke="url(#ptGrad)" stroke-width="5" stroke-linecap="round" filter="url(#glow)" />
  <path d="M 84 50 A 34 34 0 0 1 50 84" stroke="#06b6d4" stroke-width="5" stroke-linecap="round" stroke-dasharray="4 8" opacity="0.8" />
  <path d="M 50 84 A 34 34 0 0 1 16 50" stroke="#10b981" stroke-width="5" stroke-linecap="round" opacity="0.9" />
  <path d="M 16 50 A 34 34 0 0 1 50 16" stroke="#3b82f6" stroke-width="5" stroke-linecap="round" stroke-dasharray="6 6" opacity="0.6" />

  <!-- Central "P" Node Structure -->
  <path d="M 36 28 L 52 28 C 62 28 68 34 68 42 C 68 50 62 56 52 56 L 46 56 L 46 72" 
        stroke="url(#ptGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Cyber / OT Pulse Nodes -->
  <circle cx="50" cy="16" r="4" fill="#34d399" />
  <circle cx="84" cy="50" r="4" fill="#38bdf8" />
  <circle cx="50" cy="84" r="4" fill="#10b981" />
  <circle cx="16" cy="50" r="4" fill="#60a5fa" />
  <circle cx="46" cy="72" r="3.5" fill="#34d399" />
</svg>